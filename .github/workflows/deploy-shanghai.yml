name: Deploy Sub2API Canary (稳如狗)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Bare sha256 digest or full ghcr.io image@digest"
        required: true
        type: string
      affiliate_refund_reversal_stage:
        description: "Affiliate refund reversal contract stage"
        required: true
        default: disabled
        type: choice
        options:
          - disabled
          - enabled

permissions:
  contents: read
  packages: read

concurrency:
  group: production-sub2api-stable
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/xuehua123/sub2api

jobs:
  deploy:
    # One-shot compatibility branch for the v1 forced-command endpoint still
    # installed on the stable host. This branch is never merged into main.
    if: github.ref_type == 'branch' && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'codex/stable-deploy-v1-compat')
    runs-on: ubuntu-latest
    environment: production-stable

    steps:
      - name: Validate immutable image digest
        env:
          DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
          AFFILIATE_REFUND_REVERSAL_STAGE: ${{ inputs.affiliate_refund_reversal_stage }}
        run: |
          set -eu
          if [[ "$DEPLOY_IMAGE_TAG" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || [[ "$DEPLOY_IMAGE_TAG" =~ ^ghcr\.io/xuehua123/sub2api@sha256:[0-9a-f]{64}$ ]]; then
            :
          else
            echo "Only a bare sha256 digest or ${IMAGE_NAME}@sha256 digest is allowed" >&2
            exit 1
          fi
          case "$AFFILIATE_REFUND_REVERSAL_STAGE" in
            disabled|enabled) ;;
            *) echo "Affiliate refund reversal stage must be disabled or enabled" >&2; exit 1 ;;
          esac

      - name: Prepare stable deployment payload
        shell: bash
        env:
          DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          stable_deploy_payload="$(
            printf '%s\n%s\n%s\n' \
              "$DEPLOY_IMAGE_TAG" \
              "$GHCR_USERNAME" \
              "$GHCR_TOKEN" |
              base64 -w0
          )"
          echo "::add-mask::$stable_deploy_payload"
          printf 'STABLE_DEPLOY_PAYLOAD=%s\n' "$stable_deploy_payload" >> "$GITHUB_ENV"

      - name: Deploy to stable with restricted deployment user
        shell: bash
        env:
          STABLE_HOST: ${{ secrets.NEW_STABLE_HOST }}
          STABLE_USER: ${{ secrets.NEW_STABLE_USER }}
          STABLE_PORT: ${{ secrets.NEW_STABLE_PORT }}
          STABLE_DEPLOY_KEY: ${{ secrets.SHANGHAI_DEPLOY_SSH_KEY }}
          STABLE_KNOWN_HOSTS: ${{ secrets.SHANGHAI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          cleanup() {
            rm -f "$key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          if [[ -z "$STABLE_KNOWN_HOSTS" ]]; then
            echo "SHANGHAI_SSH_KNOWN_HOSTS must be configured in the protected production-stable environment" >&2
            exit 1
          fi

          printf '%s\n' "$STABLE_DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$STABLE_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file"
          chmod 600 "$known_hosts_file"

          if ! ssh-keygen -l -f "$known_hosts_file" >/dev/null; then
            echo "SHANGHAI_SSH_KNOWN_HOSTS does not contain a valid SSH host key" >&2
            exit 1
          fi

          # The deployment account is constrained by an SSH forced command. It
          # ignores remote shell text and consumes this session's stdin directly.
          printf '%s' "$STABLE_DEPLOY_PAYLOAD" |
            base64 --decode |
            ssh -T \
              -i "$key_file" \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$known_hosts_file" \
              -p "$STABLE_PORT" \
              "$STABLE_USER@$STABLE_HOST" \
              "sudo -n /usr/local/sbin/sub2api-deploy-stable"
