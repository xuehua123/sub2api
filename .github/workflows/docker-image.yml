name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/xuehua123/sub2api
  GATEWAY_IMAGE_NAME: ghcr.io/xuehua123/sub2api-lobehub-gateway

jobs:
  docker:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  gateway-docker:
    if: github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GATEWAY_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - name: Build and push LobeHub gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-new-stable:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Deploy to 新稳如狗
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          RESIN_PROXY_URL: ${{ secrets.RESIN_PROXY_URL }}
          DOCKER_NO_PROXY: ${{ secrets.DOCKER_NO_PROXY || '127.0.0.1,localhost,postgres,redis' }}
          COMPOSE_DIR: /opt/platform
          COMPOSE_FILE: docker-compose.yml
          SERVICE_NAME: sub2api
          HEALTH_URL: http://127.0.0.1:18080/health
        with:
          host: ${{ secrets.NEW_STABLE_HOST }}
          username: ${{ secrets.NEW_STABLE_USER }}
          password: ${{ secrets.NEW_STABLE_PASSWORD }}
          port: ${{ secrets.NEW_STABLE_PORT }}
          envs: IMAGE_NAME,GITHUB_SHA,GHCR_TOKEN,GHCR_USERNAME,RESIN_PROXY_URL,DOCKER_NO_PROXY,COMPOSE_DIR,COMPOSE_FILE,SERVICE_NAME,HEALTH_URL
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "$COMPOSE_DIR"

            short_sha="$(printf '%.7s' "$GITHUB_SHA")"
            image_tag="sha-${short_sha}"
            deploy_image="${IMAGE_NAME}:${image_tag}"
            backup="${COMPOSE_FILE}.bak-$(date +%Y%m%d-%H%M%S)-pre-${image_tag}"

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-x-access-token}" --password-stdin
            fi

            if [ -n "${RESIN_PROXY_URL:-}" ]; then
              export HTTP_PROXY="$RESIN_PROXY_URL"
              export HTTPS_PROXY="$RESIN_PROXY_URL"
              export http_proxy="$RESIN_PROXY_URL"
              export https_proxy="$RESIN_PROXY_URL"
              export NO_PROXY="$DOCKER_NO_PROXY"
              export no_proxy="$DOCKER_NO_PROXY"
            fi

            cp "$COMPOSE_FILE" "$backup"
            DEPLOY_IMAGE="$deploy_image" SERVICE_NAME="$SERVICE_NAME" COMPOSE_FILE="$COMPOSE_FILE" python3 <<'PY'
            from pathlib import Path
            import os

            path = Path(os.environ["COMPOSE_FILE"])
            deploy_image = os.environ["DEPLOY_IMAGE"]
            service_name = os.environ["SERVICE_NAME"]
            lines = path.read_text().splitlines()
            in_service = False
            service_indent = 0
            changed = False

            for index, line in enumerate(lines):
                stripped = line.strip()
                indent = len(line) - len(line.lstrip())
                if stripped == f"{service_name}:":
                    in_service = True
                    service_indent = indent
                    continue
                if in_service and stripped and indent <= service_indent:
                    in_service = False
                if in_service and stripped.startswith("image:"):
                    prefix = line[: len(line) - len(line.lstrip())]
                    lines[index] = f"{prefix}image: {deploy_image}"
                    changed = True
                    break

            if not changed:
                raise SystemExit(f"image line for service {service_name!r} not found")

            path.write_text("\n".join(lines) + "\n")
            PY

            docker compose -f "$COMPOSE_FILE" pull "$SERVICE_NAME"
            docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE_NAME"

            container="$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE_NAME")"
            test -n "$container"
            for _ in $(seq 1 40); do
              status="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
              echo "health=${status}"
              if [ "$status" = "healthy" ] || [ "$status" = "running" ]; then
                break
              fi
              sleep 3
            done

            status="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
            if [ "$status" != "healthy" ] && [ "$status" != "running" ]; then
              docker logs --tail=160 "$container"
              exit 1
            fi

            curl -fsS "$HEALTH_URL"
            docker compose -f "$COMPOSE_FILE" ps "$SERVICE_NAME"
            docker image prune -f

