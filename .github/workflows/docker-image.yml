name: Build Sub2API Docker Image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to rebuild (branch, tag, or commit SHA)
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: sub2api-image-${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/xuehua123/sub2api

jobs:
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref }}

      - name: Resolve image metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:7}"
          version="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
          build_date="$(git show -s --format=%cI HEAD)"

          test -n "$version"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Sub2API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.created=${{ steps.source.outputs.build_date }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.source_sha }}
            DATE=${{ steps.source.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Publish deployment reference
        shell: bash
        run: |
          {
            echo "## Sub2API image published"
            echo
            echo '```text'
            echo "${IMAGE_NAME}:sha-${{ steps.source.outputs.short_sha }}"
            echo '```'
            echo
            echo "Commit: \`${{ steps.source.outputs.source_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
