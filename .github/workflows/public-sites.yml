name: Build Public Sites
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed main commit SHA (all CI and Security Scan gates must pass)
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: public-sites-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref }}
      - name: Verify exact main and completed gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_REF"
          test "$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)" = "$RELEASE_REF"
          for workflow in backend-ci.yml security-scan.yml; do
            result="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$RELEASE_REF&event=push&per_page=1" --jq '.workflow_runs[0].conclusion')"
            test "$result" = success
          done
      - name: Package tracked static files
        run: python3 tools/package_public_sites.py dist/public-sites
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read application compatibility version
        id: version
        run: echo "value=$(cat backend/cmd/server/VERSION | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: dist/public-sites
          file: dist/public-sites/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-public-sites:sha-${{ inputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.sub2api.artifact=public-sites
          provenance: false
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "ghcr.io/${GITHUB_REPOSITORY}-public-sites@${IMAGE_DIGEST}" > dist/public-sites/image.txt
          cat dist/public-sites/image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: public-sites-${{ inputs.ref }}
          path: |
            dist/public-sites/public-sites.tar
            dist/public-sites/public-sites.tar.sha256
            dist/public-sites/image.txt
          if-no-files-found: error
