<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">CCSwitch 模型列表选择示意</title>
  <desc id="desc">刷新模型列表后，仅保留 gpt-5.6 及以上模型，移除 gpt-5.5。</desc>
  <rect width="1100" height="620" rx="22" fill="#17181d"/>
  <rect x="28" y="26" width="1044" height="568" rx="18" fill="#28292f" stroke="#4b4d56"/>
  <text x="64" y="76" fill="#f4f5f7" font-size="28" font-family="Arial, Microsoft YaHei, sans-serif" font-weight="700">选择模型 · 示例</text>
  <text x="64" y="108" fill="#b5b8c2" font-size="16" font-family="Arial, Microsoft YaHei, sans-serif">点击“获取模型列表”后，勾选需要保留的模型；示意图不含账号、Key、余额或真实路径。</text>
  <rect x="64" y="136" width="696" height="52" rx="10" fill="#1f2025" stroke="#5b5e69"/>
  <text x="90" y="170" fill="#9ea3af" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif">搜索模型…</text>
  <rect x="792" y="136" width="220" height="52" rx="10" fill="#ef7b2d"/>
  <text x="827" y="170" fill="#fff" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" font-weight="700">↻ 获取模型列表</text>
  <text x="66" y="230" fill="#c8cbd3" font-size="17" font-family="Arial, Microsoft YaHei, sans-serif">保留 5.6 及以上 · 5.5 不保留</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19">
    <rect x="64" y="254" width="948" height="52" rx="8" fill="#202126"/>
    <rect x="86" y="270" width="20" height="20" rx="4" fill="none" stroke="#737784" stroke-width="2"/>
    <text x="130" y="291" fill="#d7d9df">gpt-5.3-codex-spark · 旧版本，保持未选</text>
    <rect x="64" y="316" width="948" height="52" rx="8" fill="#203b36"/>
    <rect x="86" y="332" width="20" height="20" rx="4" fill="#ef7b2d"/>
    <path d="M91 342l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="130" y="353" fill="#f4f5f7">gpt-5.6-sol</text>
    <rect x="64" y="378" width="948" height="52" rx="8" fill="#203b36"/>
    <rect x="86" y="394" width="20" height="20" rx="4" fill="#ef7b2d"/>
    <path d="M91 404l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="130" y="415" fill="#f4f5f7">gpt-5.6-terra</text>
    <rect x="64" y="440" width="948" height="52" rx="8" fill="#203b36"/>
    <rect x="86" y="456" width="20" height="20" rx="4" fill="#ef7b2d"/>
    <path d="M91 466l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="130" y="477" fill="#f4f5f7">gpt-6-astra · gpt-6.1-sol · gpt-6.1-terra</text>
    <rect x="832" y="456" width="132" height="24" rx="12" fill="#713a2e"/>
    <text x="854" y="474" fill="#ffb39b" font-size="14">5.5 已移除</text>
  </g>
  <rect x="818" y="526" width="194" height="44" rx="9" fill="#ef7b2d"/>
  <text x="878" y="554" fill="#fff" font-size="18" font-family="Arial, Microsoft YaHei, sans-serif" font-weight="700">应用</text>
</svg>
