# Include INSIDE the docs domain server block, with root set to the generated docs-portal directory.
# No SPA fallback: unknown pages must return HTTP 404, not index.html with HTTP 200.
index index.html;
location / {
    try_files $uri $uri/ =404;
}
error_page 404 /404.html;
location = /404.html {
    internal;
}
location = /template.html { return 404; }
location = /sitemap.xml {
    types { application/xml xml; }
    try_files $uri =404;
}
location = /robots.txt {
    types { text/plain txt; }
    try_files $uri =404;
}
# Canonicals intentionally point to doc.psydo.top from mirror domains too.
# Use the same generated files on doc.ppxcode.com; do not create a second sitemap identity.

# Compress textual static assets; never cache HTML as immutable.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;
location ~* \.(?:css|js|png|webp|svg)$ {
    try_files $uri =404;
    expires 1h;
    add_header X-Content-Type-Options nosniff always;
}
