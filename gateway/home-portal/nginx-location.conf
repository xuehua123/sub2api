# Include this before sub2api-public-locations.conf in the api.psydo.top server block.
# Keep the portal outside the application container so homepage changes cannot affect API traffic.
location ^~ /home/ {
    alias /srv/sub2api/home-portal/;
    index index.html;
    try_files $uri $uri/ =404;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "public, max-age=300" always;
}
